<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Encode / Decode Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Có thể dùng tailwind CDN cho nhanh -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
<div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-2xl">
    <h1 class="text-2xl font-bold mb-4 text-slate-800">Encode / Decode (Password + Salt)</h1>

    {% if error %}
        <div class="mb-4 p-3 rounded bg-red-100 text-red-700 text-sm">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/code" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Mode</label>
            <select name="mode" class="w-full border rounded px-3 py-2 text-sm">
                <option value="encode" {% if mode == "encode" %}selected{% endif %}>Encode (Mã hoá)</option>
                <option value="decode" {% if mode == "decode" %}selected{% endif %}>Decode (Giải mã)</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
                Data {{ mode == "encode" and '(plain text)' or '(cipher text)' }}
            </label>
            <textarea name="input_data" rows="4"
                      class="w-full border rounded px-3 py-2 text-sm"
                      placeholder="Nhập dữ liệu cần {{ mode }}...">{{ input_data }}</textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password"
                       value="{{ password }}"
                       class="w-full border rounded px-3 py-2 text-sm"
                       placeholder="Nhập password..." />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Salt</label>
                <input type="text" name="salt"
                       value="{{ salt }}"
                       class="w-full border rounded px-3 py-2 text-sm"
                       placeholder="Nhập salt (ví dụ: my-app-salt)" />
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded">
                Thực hiện {{ mode | capitalize }}
            </button>
        </div>
    </form>

    <div class="mt-6">
        <label class="block text-sm font-medium text-slate-700 mb-1">Result</label>
        <textarea readonly rows="4"
                  class="w-full border rounded px-3 py-2 text-sm bg-slate-50">{{ result }}</textarea>
    </div>

    <p class="mt-4 text-xs text-slate-500">
        • Password + Salt được dùng để tạo key bằng PBKDF2-HMAC-SHA256 (390,000 vòng), sau đó dùng Fernet để encode/decode.<br>
        • Để decode thành công, phải dùng đúng <strong>password</strong>, <strong>salt</strong> và <strong>cipher text</strong> đã encode trước đó.
    </p>
</div>
</body>
</html>
