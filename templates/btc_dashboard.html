<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BTC Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #222;
      margin: 0;
      padding: 24px 0;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 30px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a1a1a;
    }

    h2 {
      font-size: 20px;
      color: #202020;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid #e4e6eb;
      margin-bottom: 28px;
    }

    canvas {
      max-width: 100%;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>BTC Dashboard</h1>
  <div class="subtitle">
    Symbol: {{ symbol }} – BUY/SELL zones – RSI H4 – MACD Histogram
  </div>

  <!-- PRICE CHART -->
  <div class="card">
    <h2>BTC Price History (overlay RSI H4)</h2>
    <canvas id="priceChart"></canvas>
  </div>

  <!-- RSI + MACD -->
  <div class="card">
    <h2>RSI H4 & MACD Histogram</h2>
    <canvas id="indicatorChart"></canvas>
  </div>

</div>

<script>
  const labels = {{ labels | tojson }};
  const prices = {{ prices | tojson }};
  const rsiRaw = {{ rsi_values | tojson }};
  const macdHistValues = {{ macd_hist_values | tojson }};

  const rsiShifted = rsiRaw.map(v => v - 50);

  const buyLow  = {{ buy_low  if buy_low  is not none else 'null' }};
  const buyHigh = {{ buy_high if buy_high is not none else 'null' }};
  const sellLow = {{ sell_low if sell_low is not none else 'null' }};
  const sellHigh= {{ sell_high if sell_high is not none else 'null' }};

  /* ZONE PLUGIN */
  const priceZonesPlugin = {
    id: 'priceZones',
    beforeDraw(chart) {
      if (chart.canvas.id !== "priceChart") return;
      if (!buyLow || !buyHigh || !sellLow || !sellHigh) return;

      const {ctx, chartArea, scales} = chart;
      const {left, right} = chartArea;
      const y = scales['y-price'];
      if (!y) return;

      const yBuyLow  = y.getPixelForValue(buyLow);
      const yBuyHigh = y.getPixelForValue(buyHigh);
      const ySellLow = y.getPixelForValue(sellLow);
      const ySellHigh= y.getPixelForValue(sellHigh);

      ctx.save();
      ctx.fillStyle = "rgba(0, 200, 120, 0.12)";
      ctx.fillRect(left, yBuyHigh, right-left, yBuyLow-yBuyHigh);
      ctx.fillStyle = "rgba(255, 80, 80, 0.12)";
      ctx.fillRect(left, ySellHigh, right-left, ySellLow-ySellHigh);
      ctx.restore();
    }
  };

  Chart.register(priceZonesPlugin);

  /* === PRICE + RSI OVERLAY === */
  new Chart(document.getElementById("priceChart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: "BTC Price",
          data: prices,
          borderWidth: 1.8,
          borderColor: "#f59e0b",
          pointRadius: 0,
          tension: 0.25,
          yAxisID: "y-price"
        },
        {
          label: "RSI H4",
          data: rsiRaw,
          borderWidth: 1.2,
          borderColor: "#10b981",
          pointRadius: 0,
          tension: 0.25,
          yAxisID: "y-rsi"
        }
      ]
    },
    options: {
      scales: {
        x: { ticks: { color: "#555" } },
        "y-price": {
          position: "left",
          ticks: { color: "#555" }
        },
        "y-rsi": {
          position: "right",
          min: 0,
          max: 100,
          grid: { drawOnChartArea: false },
          ticks: { color: "#0f766e" },
          title: { display: true, text: "RSI (H4)" }
        }
      },
      plugins: {
        legend: { labels: { color: "#222" } }
      }
    }
  });

  /* === RSI+MACD (RSI=50 = MACD 0) === */
  new Chart(document.getElementById("indicatorChart"), {
    data: {
      labels,
      datasets: [
        {
          type: "line",
          label: "RSI H4",
          data: rsiShifted,
          borderColor: "#3b82f6",
          borderWidth: 1.5,
          pointRadius: 0,
          yAxisID: "y1"
        },
        {
          type: "bar",
          label: "MACD Hist",
          data: macdHistValues,
          backgroundColor: "#9ca3af",
          yAxisID: "y2"
        }
      ]
    },
    options: {
      scales: {
        x: { ticks: { color: "#555" } },
        y1: {
          position: "left",
          min: -50,
          max: +50,
          ticks: {
            color: "#444",
            callback: (value) => value + 50
          },
          title: { display: true, text: "RSI H4" }
        },
        y2: {
          position: "right",
          ticks: { color: "#444" },
          grid: { drawOnChartArea: false }
        }
      },
      plugins: {
        legend: { labels: { color: "#222" } }
      }
    }
  });
</script>

</body>
</html>
