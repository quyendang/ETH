<!DOCTYPE html>
<html>
<head>
    <title>TTS Keys</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            margin: 0;
            padding-top: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 600px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .message {
            text-align: center;
            margin-bottom: 15px;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .delete-btn {
            padding: 5px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        .add-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .add-btn:hover {
            background-color: #0056b3;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        #addForm {
            display: none;
        }
    </style>
    <script>
        function showAddForm() {
            document.getElementById('addForm').style.display = 'block';
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>TTS Keys</h1>
        {% if success %}
            <div class="message success">{{ success }}</div>
        {% endif %}
        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}
        <button class="add-btn" onclick="showAddForm()">Add New Key</button>
        <table>
            <tr>
                <th>API Key</th>
                <th>Base URL</th>
                <th>Provider</th>
                <th>Action</th>
            </tr>
            {% for key in keys %}
            <tr>
                <td>{{ key.api_key }}</td>
                <td>{{ key.base_url }}</td>
                <td>{{ key.provider }}</td>
                <td>
                    <form method="post" action="/delete_key/{{ key.id }}">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
        <div id="addForm">
            <form method="post">
                <div class="form-group">
                    <label for="api_key">API Key:</label>
                    <input type="text" id="api_key" name="api_key" required>
                </div>
                <div class="form-group">
                    <label for="base_url">Base URL:</label>
                    <input type="text" id="base_url" name="base_url" required>
                </div>
                <div class="form-group">
                    <label for="provider">Provider:</label>
                    <select id="provider" name="provider" required>
                        <option value="Google">Google</option>
                        <option value="OpenAI">OpenAI</option>
                        <option value="Elevenlabs">Elevenlabs</option>
                    </select>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
